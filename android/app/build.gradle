import java.util.Properties

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: create android/key.properties (see android/key.properties.example).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties.getProperty(it)?.trim()
}
def releaseKeystorePath = keystoreProperties.getProperty('storeFile')?.trim()
def releaseKeystoreFile = releaseKeystorePath ? file(releaseKeystorePath) : null
def releaseSigningConfigured = keystorePropertiesFile.exists() &&
        missingSigningProperties.isEmpty() &&
        releaseKeystoreFile?.isFile()

tasks.register('validateReleaseSigning') {
    doLast {
        if (!keystorePropertiesFile.isFile()) {
            throw new GradleException(
                    'Release builds require android/key.properties. Copy android/key.properties.example and configure a production keystore.')
        }
        if (!missingSigningProperties.isEmpty()) {
            throw new GradleException(
                    "Release signing properties are missing: ${missingSigningProperties.join(', ')}.")
        }
        if (!releaseKeystoreFile?.isFile()) {
            throw new GradleException(
                    "Release keystore does not exist: ${releaseKeystorePath}.")
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('validateReleaseSigning')
}

android {
    namespace = "com.personal.phone_addiction_controller"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required for Hive on older APIs
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.personal.phone_addiction_controller"
        // startForegroundService() and notification channels require Android 8.0 (API 26)
        minSdkVersion = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}
flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring for Java 8+ APIs on API < 26
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")

    // Kotlin standard library
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20")

    // AndroidX Core
    implementation("androidx.core:core-ktx:1.13.1")

    // AndroidX Lifecycle for ForegroundService
    implementation("androidx.lifecycle:lifecycle-service:2.8.3")
}
