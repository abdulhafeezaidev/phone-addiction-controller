<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>App Blocked - Focus Vault</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#343535",
                        "secondary": "#c8c6c8",
                        "tertiary-container": "#a56500",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb867",
                        "on-tertiary-fixed-variant": "#673d00",
                        "on-primary-fixed": "#000965",
                        "inverse-on-surface": "#2f3131",
                        "inverse-primary": "#4854bb",
                        "on-surface-variant": "#c6c5d5",
                        "surface-variant": "#343535",
                        "inverse-surface": "#e3e2e2",
                        "error-container": "#93000a",
                        "on-primary-container": "#fdfaff",
                        "secondary-fixed-dim": "#c8c6c8",
                        "primary-fixed-dim": "#bdc2ff",
                        "on-tertiary-fixed": "#2b1700",
                        "surface-container-lowest": "#0d0e0f",
                        "outline": "#908f9e",
                        "surface-tint": "#bdc2ff",
                        "surface-bright": "#383939",
                        "surface": "#121414",
                        "tertiary": "#ffb867",
                        "surface-container": "#1e2020",
                        "on-secondary-fixed-variant": "#474649",
                        "on-background": "#e3e2e2",
                        "on-secondary-container": "#b6b4b7",
                        "primary": "#bdc2ff",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-surface": "#e3e2e2",
                        "surface-dim": "#121414",
                        "on-secondary": "#303032",
                        "on-primary-fixed-variant": "#2e3aa2",
                        "surface-container-high": "#292a2a",
                        "on-primary": "#121f8b",
                        "primary-fixed": "#dfe0ff",
                        "background": "#121414",
                        "surface-container-low": "#1a1c1c",
                        "on-tertiary-container": "#fffaf8",
                        "on-error": "#690005",
                        "secondary-container": "#474649",
                        "primary-container": "#5e6ad2",
                        "on-tertiary": "#482900",
                        "tertiary-fixed": "#ffddbb",
                        "secondary-fixed": "#e4e2e4",
                        "outline-variant": "#454652",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "squircle": "24px" // Adding squircle for One UI style
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-gap": "12px",
                        "interaction-margin": "24px",
                        "card-padding": "20px",
                        "viewing-area-top": "80px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "title-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-xl": ["34px", { "lineHeight": "44px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "display-lg": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle pulse for countdown */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .pulse-text {
            animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Overlay Container -->
<main class="flex-1 flex flex-col w-full h-full relative z-10 px-interaction-margin pb-interaction-margin pt-viewing-area-top">
<!-- Viewing Area (Top 1/3) -->
<div class="flex-1 flex flex-col items-center justify-center text-center pb-8 animate-[fadeIn_0.5s_ease-out]">
<!-- Blocked App Icon -->
<div class="relative mb-8">
<div class="w-32 h-32 rounded-[32px] bg-surface-container-high border border-[#2C2C2E] flex items-center justify-center shadow-lg shadow-black/40">
<span class="material-symbols-outlined text-[64px] text-error icon-fill">
                        block
                    </span>
</div>
<!-- App Icon Overlay Hint -->
<div class="absolute -bottom-2 -right-2 w-10 h-10 rounded-full bg-surface-container border-2 border-background flex items-center justify-center">
<span class="material-symbols-outlined text-xl text-primary">
                        apps
                    </span>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-xl text-headline-xl mb-4 text-on-surface">Application Unavailable</h1>
<!-- Description -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                This app is currently restricted to maintain your focus session.
            </p>
</div>
<!-- Interaction Area (Bottom 2/3) -->
<div class="w-full max-w-md mx-auto flex flex-col gap-stack-gap">
<!-- Countdown Card -->
<div class="bg-[#212123] border border-[#2C2C2E] rounded-squircle p-card-padding flex flex-col items-center justify-center gap-2 mb-4">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Remaining Focus Time</span>
<div class="font-display-lg text-display-lg text-primary pulse-text tracking-tighter">
                    42:15
                </div>
<div class="flex items-center gap-1.5 text-secondary mt-1">
<span class="material-symbols-outlined text-sm">timer</span>
<span class="font-body-md text-body-md">Session ends at 4:30 PM</span>
</div>
</div>
<!-- Action Buttons -->
<button class="w-full h-14 bg-primary-container text-on-primary-container rounded-squircle font-title-md text-title-md flex items-center justify-center gap-2 active:bg-[#4854bb] transition-colors shadow-sm">
<span class="material-symbols-outlined">home</span>
                Return Home
            </button>
<button class="w-full h-14 bg-[#2C2C2E] text-on-surface rounded-squircle font-title-md text-title-md flex items-center justify-center gap-2 active:bg-[#343535] transition-colors border border-transparent">
<span class="material-symbols-outlined">lock_open</span>
                Enter Admin Password
            </button>
</div>
</main>
<!-- Background Pattern (Subtle indication of being locked out) -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-[0.03] mix-blend-overlay" style="background-image: repeating-linear-gradient(45deg, #fff 0, #fff 1px, transparent 0, transparent 50%); background-size: 20px 20px;"></div>
</body></html>
