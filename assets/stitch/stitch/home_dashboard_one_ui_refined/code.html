<style>
        body {
            background-color: #121214;
            color: #e3e2e2;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .squircle {
            border-radius: 24px;
        }
        .card-bg {
            background-color: #212123;
            border: 1px solid #2C2C2E;
        }
        .timer-ring {
            stroke-dasharray: 879;
            stroke-dashoffset: 879;
            transform-origin: center;
            transform: rotate(-90deg);
            transition: stroke-dashoffset 0.5s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="antialiased min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full pt-viewing-area-top pb-gutter bg-background dark:bg-background flat no shadows flex flex-col px-interaction-margin w-full sticky top-0 z-40 transition-colors duration-200">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3 text-primary dark:text-primary">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<h1 class="font-headline-xl text-headline-xl font-bold text-primary dark:text-primary tracking-tight">Focus Vault</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant flex items-center justify-center bg-surface-container-high cursor-pointer hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas (Viewing Area to Interaction Area) -->
<main class="flex-1 px-interaction-margin flex flex-col gap-stack-gap mt-4">
<!-- Viewing Area: Status Ring -->
<section class="flex flex-col items-center justify-center py-8">
<div class="relative w-[280px] h-[280px] flex items-center justify-center">
<!-- Outer Track -->
<svg class="w-full h-full absolute inset-0" viewbox="0 0 300 300">
<circle cx="150" cy="150" fill="none" r="140" stroke="#2C2C2E" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Progress Ring (Inactive State) -->
<svg class="w-full h-full absolute inset-0" viewbox="0 0 300 300">
<circle class="timer-ring opacity-20" cx="150" cy="150" fill="none" r="140" stroke="#5E6AD2" stroke-linecap="round" stroke-width="12" style="stroke-dashoffset: 0;"></circle>
</svg>
<div class="flex flex-col items-center text-center z-10">
<span class="font-display-lg text-display-lg text-on-background">--:--</span>
<span class="font-title-md text-title-md text-on-surface-variant mt-2">Inactive</span>
</div>
</div>
<button class="mt-8 bg-primary-container text-on-primary-container font-title-md text-title-md h-[56px] px-8 rounded-[28px] squircle flex items-center gap-2 hover:bg-[#4854bb] transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Start Focus Session
            </button>
</section>
<!-- Interaction Area: Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-stack-gap mt-4">
<!-- Weekly Summary Card -->
<div class="card-bg squircle p-card-padding flex flex-col md:col-span-12">
<div class="flex items-center justify-between mb-4">
<h2 class="font-title-md text-title-md text-on-background">Weekly Summary</h2>
<span class="material-symbols-outlined text-on-surface-variant">more_horiz</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface-variant mb-1">Total Focus Time</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">24h 15m</span>
</div>
<div class="flex flex-col items-end text-right">
<span class="font-body-md text-body-md text-on-surface-variant mb-1">vs Last Week</span>
<div class="flex items-center gap-1 text-[#81c784]">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span class="font-title-md text-title-md">+15%</span>
</div>
</div>
</div>
<!-- Simple Activity Bar Chart placeholder -->
<div class="w-full h-16 mt-6 flex items-end justify-between gap-1">
<div class="w-full bg-primary-container rounded-t-sm" style="height: 40%;"></div>
<div class="w-full bg-primary-container rounded-t-sm" style="height: 60%;"></div>
<div class="w-full bg-primary-container rounded-t-sm" style="height: 80%;"></div>

<div class="w-full bg-surface-variant rounded-t-sm" style="height: 5%;"></div>
</div>
<div class="w-full flex justify-between mt-2 px-1">
<span class="font-label-md text-label-md text-on-surface-variant">M</span>
<span class="font-label-md text-label-md text-on-surface-variant">T</span>
<span class="font-label-md text-label-md text-on-surface-variant">W</span>
<span class="font-label-md text-label-md text-on-surface-variant">T</span>
<span class="font-label-md text-label-md text-on-surface-variant">F</span>
<span class="font-label-md text-label-md text-on-surface-variant">S</span>
<span class="font-label-md text-label-md text-on-surface-variant">S</span>
</div>
</div>

<button class="card-bg squircle p-card-padding flex flex-col items-start gap-3 hover:bg-surface-variant transition-colors active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-[#2C2C2E] flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">block</span>
</div>
<div class="text-left">
<h3 class="font-title-md text-title-md text-on-background">Block Apps</h3>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">3 active rules</p>
</div>
</button>
<button class="card-bg squircle p-card-padding flex flex-col items-start gap-3 hover:bg-surface-variant transition-colors active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-[#2C2C2E] flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">flag</span>
</div>
<div class="text-left">
<h3 class="font-title-md text-title-md text-on-background">Daily Goal</h3>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">4h target</p>
</div>
</button>
</div>
</div>

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-full scale-95 active:scale-90 transition-transform duration-150 group">

<span class="material-symbols-outlined text-[24px]">bar_chart</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-full scale-95 active:scale-90 transition-transform duration-150 group">

<span class="font-title-md text-title-md hidden lg:block">Home</span>
</button>
<button class="flex lg:flex-row flex-col items-center lg:justify-start justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-3 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-xl scale-95 active:scale-90 transition-transform duration-150 gap-3">
<span class="material-symbols-outlined text-[24px]">apps</span>

<button class="flex lg:flex-row flex-col items-center lg:justify-start justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-3 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-xl scale-95 active:scale-90 transition-transform duration-150 gap-3">

<span class="font-title-md text-title-md hidden lg:block">Focus</span>
